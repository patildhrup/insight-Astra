services:
  - type: web
    name: insightx-backend
    env: python
    plan: free
    rootDirectory: Backend # Point to the backend folder
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app
    envVars:
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_PROJECT_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_DB
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "https://astra-y4o7.onrender.com,http://localhost:5173"
      - key: PORT
        value: "8000"
